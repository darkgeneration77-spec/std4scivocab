const host=d.createElement('section');host.id='examUpgrade';host.innerHTML=`<div class="upgradeBox"><div class="upgradeTop"><div class="upgradeTitle"><div class="upgradeIcon">◎</div><div><h2>题目解码器</h2><div class="upgradeSub">认出题型 → 找到关键 → 套用正确答案结构</div></div></div><div class="examBtns"><button class="examBtn on" data-filter="ALL">全部词汇</button><button class="examBtn" data-filter="A">A 级必会</button></div></div><div class="decoderGrid"><div class="decode"><b>写出一个推断</b><span>判断：什么科学解释能够说明这个观察？</span><em>答案：直接写科学解释，不重复观察。</em></div><div class="decode"><b>写出一个预测</b><span>判断：根据已有资料的变化模式，接下来会怎样？</span><em>答案：延续已有趋势。</em></div><div class="decode"><b>写出两个变数的关系</b><span>判断：A 改变时，B 怎样改变？</span><em>骨架：随着 A 增加，B 增加／减少。</em></div><div class="decode"><b>写出操纵性变数</b><span>判断：实验中刻意改变什么？</span><em>只写被刻意改变的条件。</em></div><div class="decode"><b>写出反应性变数</b><span>判断：实验中观察或测量什么？</span><em>写实际被观察或测量的结果。</em></div><div class="decode"><b>写出结论</b><span>判断：整个实验最终证明什么关系？</span><em>不要只抄一个数据或一次观察。</em></div></div></div>`;const hero=d.querySelector('.hero');if(hero&&hero.parentNode)hero.parentNode.insertBefore(host,hero.nextSibling);else(d.querySelector('.wrap')||d.body).insertBefore(host,(d.querySelector('.wrap')||d.body).firstChild);
let filter='ALL';const apply=()=>{const cards=[...d.querySelectorAll('#grid .card')];cards.forEach(c=>{c.style.display=(filter==='ALL'||c.textContent.includes('A级'))?'':'none'});const count=d.getElementById('count');if(count&&filter==='A')count.textContent=cards.filter(c=>c.style.display!=='none').length};host.querySelectorAll('.examBtn').forEach(b=>b.onclick=()=>{host.querySelectorAll('.examBtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;apply()});const grid=d.getElementById('grid');if(grid)new MutationObserver(()=>setTimeout(apply,0)).observe(grid,{childList:true});
const conf={"排泄":"不要混淆：排泄是人体排出排泄物；排遗是粪便通过肛门排出体外。","排遗":"不要混淆：排遗是粪便通过肛门排出体外；排泄是人体排出排泄物。","操纵性变数":"判断法：实验中刻意改变的条件。不要写成观察或测量的结果。","反应性变数":"判断法：实验中观察或测量的结果。不要写成刻意改变的条件。","固定性变数":"判断法：为了公平实验而保持相同的条件。","观察":"不要混淆：观察写实际看到、量到或读到的事实；推断写科学解释。","推断":"不要混淆：推断解释观察事实，不把观察重新抄一次。","预测":"不要混淆：预测根据已有模式推测接下来可能出现的结果。","自转":"不要混淆：自转是地球绕地轴转动；公转是地球沿轨道绕太阳运行。","公转":"不要混淆：公转是地球沿轨道绕太阳运行；自转是地球绕地轴转动。"};const modal=d.getElementById('modal');if(modal)new MutationObserver(()=>{if(!modal.classList.contains('open'))return;const title=d.getElementById('mt');if(!title)return;modal.querySelectorAll('.mixHint').forEach(x=>x.remove());const txt=conf[title.textContent.trim()];if(txt){const box=d.createElement('div');box.className='mixHint';box.innerHTML='<b>易错提醒：</b>'+txt;(d.getElementById('ma')||title).insertAdjacentElement('afterend',box)}}).observe(modal,{attributes:true,attributeFilter:['class']});apply()}catch(e){console.warn(e)}});</script></body></html>
