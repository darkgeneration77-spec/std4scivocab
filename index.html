<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>四年级科学</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e8}
    #app{width:100%;height:100%;border:0;display:block;background:#fffaf2}
    #loading{position:fixed;inset:0;display:grid;place-items:center;font:800 24px/1.7 system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif;color:#59483c;background:#fffaf2;z-index:10}
  </style>
</head>
<body>
  <div id="loading">正在载入四年级科学学习系统…</div>
  <iframe id="app" title="四年级科学学习系统" src="./%E5%9B%9B%E5%B9%B4%E7%BA%A7%E7%A7%91%E5%AD%A6.html"></iframe>
  <script>
  (()=>{
    const f=document.getElementById('app');
    f.addEventListener('load',()=>{
      document.getElementById('loading').style.display='none';
      try{
        const d=f.contentDocument;
        if(!d||d.getElementById('large-reading-fonts')) return;
        const st=d.createElement('style');
        st.id='large-reading-fonts';
        st.textContent=`
          html{font-size:22px!important}
          body{font-size:22px!important;line-height:1.78!important}
          p,li,td,th,label,.meaning,.answer,.desc,.note,.rulebox,.tool-card,.panel,.sectionbox,.helper,.hint,.example,.explain{font-size:21px!important;line-height:1.78!important}
          .word{font-size:30px!important;line-height:1.28!important;font-weight:900!important}
          .py,.pinyin{font-size:20px!important;line-height:1.55!important}
          .badge{font-size:18px!important;padding:9px 13px!important}
          h1,.hero h1,.title{font-size:clamp(44px,6vw,72px)!important;line-height:1.14!important}
          h2{font-size:36px!important;line-height:1.28!important}
          h3{font-size:29px!important;line-height:1.34!important}
          h4{font-size:24px!important;line-height:1.4!important}
          .tab,.unit-tab,.nav button,.unitOrb b,.quickDock button{font-size:20px!important;line-height:1.35!important}
          .card{padding:26px!important;gap:14px!important}
          .card[data-level='A']{min-height:260px!important}.card[data-level='B']{min-height:240px!important}.card[data-level='C']{min-height:220px!important}
          .conceptCopy b,.examCopy>b,.trapBody>b,.dataBody>b{font-size:25px!important;line-height:1.35!important}
          .conceptCopy span,.examCopy span,.trapBody p,.trapBody>div,.dataBody p,.dataBody>div{font-size:20px!important;line-height:1.72!important}
          .examCopy strong{font-size:18px!important}
          input,button,select,textarea{font-size:20px!important;line-height:1.4!important}
          .progressText,.conceptHeading p,.examVisualHead p,.trapHead>p,.dataHead>p{font-size:20px!important;line-height:1.68!important}
          .modal,.modal p,.modal div,.modal span,.modal li{font-size:21px!important;line-height:1.75!important}
          .modal h2,.modal .word{font-size:34px!important}
          .dataBody,.trapBody,.examCopy,.conceptCopy{padding:18px!important}
          @media(max-width:900px){
            .dataGrid,.trapGrid,.examVisualGrid,.conceptGrid{grid-template-columns:1fr 1fr!important}
          }
          @media(max-width:760px){
            html,body{font-size:20px!important}
            p,li,td,th,label,.meaning,.answer,.desc,.note,.rulebox,.tool-card,.panel,.sectionbox,.helper,.hint,.example,.explain{font-size:19px!important;line-height:1.72!important}
            .word{font-size:27px!important}.py,.pinyin{font-size:18px!important}
            h1,.hero h1,.title{font-size:clamp(36px,10vw,50px)!important}
            h2{font-size:31px!important}h3{font-size:26px!important}h4{font-size:22px!important}
            .tab,.unit-tab,.nav button,.unitOrb b,.quickDock button{font-size:18px!important}
            .conceptCopy b,.examCopy>b,.trapBody>b,.dataBody>b{font-size:22px!important}
            .conceptCopy span,.examCopy span,.trapBody p,.trapBody>div,.dataBody p,.dataBody>div{font-size:18px!important;display:block!important}
            .examCopy strong{font-size:17px!important}
            input,button,select,textarea{font-size:18px!important}
            .progressText,.conceptHeading p,.examVisualHead p,.trapHead>p,.dataHead>p{font-size:18px!important}
            .card{padding:22px!important;min-height:auto!important}
            .dataBody,.trapBody,.examCopy,.conceptCopy{padding:16px!important}
          }
          @media(max-width:520px){
            .dataGrid,.trapGrid,.examVisualGrid,.conceptGrid{grid-template-columns:1fr!important}
            html,body{font-size:20px!important}
            p,li,td,th,label,.meaning,.answer,.desc,.note,.rulebox,.tool-card,.panel,.sectionbox,.helper,.hint,.example,.explain{font-size:19px!important}
            .word{font-size:28px!important}.py,.pinyin{font-size:18px!important}
            .conceptCopy b,.examCopy>b,.trapBody>b,.dataBody>b{font-size:23px!important}
            .conceptCopy span,.examCopy span,.trapBody p,.trapBody>div,.dataBody p,.dataBody>div{font-size:18.5px!important}
          }
        `;
        d.head.appendChild(st);
      }catch(e){console.warn('Font enhancement skipped',e)}
    });
  })();
  </script>
</body>
</html>
