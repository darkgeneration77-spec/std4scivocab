<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>四年级科学</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e8}
    #app{width:100%;height:100%;border:0;display:block;background:#fffaf2}
    #loading{position:fixed;inset:0;display:grid;place-items:center;font:700 18px/1.6 system-ui,"Noto Sans SC","Microsoft YaHei",sans-serif;color:#59483c;background:#fffaf2;z-index:10}
  </style>
</head>
<body>
  <div id="loading">正在载入四年级科学学习系统…</div>
  <iframe id="app" title="四年级科学学习系统" src="./%E5%9B%9B%E5%B9%B4%E7%BA%A7%E7%A7%91%E5%AD%A6.html"></iframe>
  <script>
  (()=>{
    const f=document.getElementById('app');
    f.addEventListener('load',()=>{
      document.getElementById('loading').style.display='none';
      try{
        const d=f.contentDocument;
        if(!d||d.getElementById('large-reading-fonts')) return;
        const st=d.createElement('style');
        st.id='large-reading-fonts';
        st.textContent=`
          html{font-size:18px!important}
          body{font-size:18px!important;line-height:1.68!important}
          p,li,td,th,label,.meaning,.answer,.desc,.note,.rulebox,.tool-card,.panel,.sectionbox{font-size:17px!important;line-height:1.68!important}
          .word{font-size:22px!important;line-height:1.35!important}
          .py,.pinyin{font-size:16px!important;line-height:1.5!important}
          .badge{font-size:14px!important;padding:7px 10px!important}
          h1,.hero h1,.title{font-size:clamp(34px,5vw,58px)!important;line-height:1.18!important}
          h2{font-size:28px!important;line-height:1.3!important}
          h3{font-size:22px!important;line-height:1.35!important}
          .tab,.unit-tab,.nav button,.unitOrb b{font-size:16px!important}
          .card{padding:20px!important}
          .card[data-level='A']{min-height:210px!important}.card[data-level='B']{min-height:195px!important}.card[data-level='C']{min-height:180px!important}
          .conceptCopy b,.examCopy>b,.trapBody>b,.dataBody>b{font-size:18px!important}
          .conceptCopy span,.examCopy span,.trapBody p,.trapBody>div,.dataBody p,.dataBody>div{font-size:15.5px!important;line-height:1.62!important}
          .examCopy strong{font-size:13px!important}
          input,button,select,textarea{font-size:16px!important}
          .progressText,.conceptHeading p,.examVisualHead p,.trapHead>p,.dataHead>p{font-size:15px!important;line-height:1.6!important}
          @media(max-width:760px){
            html,body{font-size:17px!important}
            p,li,.meaning,.answer,.desc,.note,.rulebox,.tool-card,.panel,.sectionbox{font-size:16.5px!important}
            .word{font-size:21px!important}.py,.pinyin{font-size:15.5px!important}
            h2{font-size:25px!important}h3{font-size:20px!important}
            .tab,.unit-tab,.nav button,.unitOrb b{font-size:15px!important}
            .conceptCopy span,.examCopy span,.trapBody p,.trapBody>div,.dataBody p,.dataBody>div{font-size:15px!important;display:block!important}
            .card{padding:17px!important;min-height:auto!important}
          }
        `;
        d.head.appendChild(st);
      }catch(e){console.warn('Font enhancement skipped',e)}
    });
  })();
  </script>
</body>
</html>
