<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>四年级科学核心词汇</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffaf2}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" title="四年级科学核心词汇" src="./%E5%9B%9B%E5%B9%B4%E7%BA%A7%E7%A7%91%E5%AD%A6_%E8%B6%85%E5%A4%A7%E5%AD%97%E4%BD%93%E7%89%88.html"></iframe><script>
const f=document.getElementById('app');
f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d||d.getElementById('exam-upgrade'))return;
const st=d.createElement('style');st.id='exam-upgrade';st.textContent=`
#examUpgrade{margin:18px auto 24px;max-width:1180px;padding:0 18px}.upgradeBox{background:linear-gradient(145deg,#fffdf8,#f7efe4);border:1px solid #eadbca;border-radius:26px;padding:22px;box-shadow:0 12px 30px rgba(84,62,45,.10)}.upgradeBox h2{margin:0 0 8px;font-size:30px!important}.upgradeBox>p{margin:0 0 16px;font-size:19px!important}.examBtns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.examBtn{border:1px solid #d8c4ae;background:#fff;border-radius:999px;padding:10px 16px;font-size:18px!important;font-weight:800;cursor:pointer}.examBtn.on{background:#47372e;color:white}.decoderGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.decode{background:#fff;border:1px solid #eadfd3;border-radius:18px;padding:16px}.decode b{display:block;font-size:21px;margin-bottom:6px}.decode span{font-size:17px;line-height:1.65;display:block}.decode em{display:block;margin-top:8px;font-style:normal;font-weight:800;font-size:17px;color:#76553e}.smartTip{margin-top:14px;padding:14px 16px;border-radius:16px;background:#fff8dd;font-size:17px;line-height:1.65}.smartTip b{font-size:18px}mark{background:#ffe681;border-radius:5px;padding:0 2px}.mixHint{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff3ef;font-size:16px;line-height:1.55}.mixHint b{font-size:16px}@media(max-width:850px){.decoderGrid{grid-template-columns:1fr}.upgradeBox h2{font-size:26px!important}}
`;d.head.appendChild(st);
const host=d.createElement('section');host.id='examUpgrade';host.innerHTML=`<div class="upgradeBox"><h2>题目解码器</h2><p>先认出题目要你做什么，再决定答案格式。不要看到科学题就开始凭感觉写小说。</p><div class="examBtns"><button class="examBtn on" data-filter="ALL">全部词汇</button><button class="examBtn" data-filter="A">只看 A 级必会</button></div><div class="decoderGrid"><div class="decode"><b>写出一个推断</b><span>脑中转换：什么科学解释能够说明这个观察？</span><em>答案：直接写科学解释，不重复观察。</em></div><div class="decode"><b>写出一个预测</b><span>脑中转换：根据已有资料的变化模式，接下来会怎样？</span><em>答案：延续已有趋势。</em></div><div class="decode"><b>写出两个变数的关系</b><span>脑中转换：A 改变时，B 怎样改变？</span><em>骨架：随着 A 增加，B 增加／减少。</em></div><div class="decode"><b>写出操纵性变数</b><span>脑中转换：实验中刻意改变什么？</span><em>只写被刻意改变的条件。</em></div><div class="decode"><b>写出反应性变数</b><span>脑中转换：实验中观察或测量什么？</span><em>写实际被观察或测量的结果。</em></div><div class="decode"><b>写出结论</b><span>脑中转换：整个实验最终证明什么关系？</span><em>不要只抄一个数据或一次观察。</em></div></div><div class="smartTip"><b>搜索升级：</b>可以直接搜“推断、哪一个变数、呼吸率、光合作用、增加、减少”等题目语言。搜索结果会继续利用原本词汇、解释、答题意识和例子进行匹配。</div></div>`;
const top=d.querySelector('.wrap')||d.body;const hero=d.querySelector('.hero');if(hero&&hero.parentNode)hero.parentNode.insertBefore(host,hero.nextSibling);else top.insertBefore(host,top.firstChild);
let filter='ALL';const apply=()=>{const cards=[...d.querySelectorAll('#grid .card')];cards.forEach(c=>{const ok=filter==='ALL'||c.textContent.includes('A级');c.style.display=ok?'':'none'});const count=d.getElementById('count');if(count&&filter==='A')count.textContent=cards.filter(c=>c.style.display!=='none').length};
host.querySelectorAll('.examBtn').forEach(b=>b.onclick=()=>{host.querySelectorAll('.examBtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;apply()});
const grid=d.getElementById('grid');if(grid)new MutationObserver(()=>setTimeout(apply,0)).observe(grid,{childList:true});
const conf={"排泄":"不要混淆：排泄是人体排出排泄物；排遗是粪便通过肛门排出体外。","排遗":"不要混淆：排遗是粪便通过肛门排出体外；排泄是人体排出排泄物。","操纵性变数":"判断法：实验中刻意改变的条件。不要写成观察或测量的结果。","反应性变数":"判断法：实验中观察或测量的结果。不要写成刻意改变的条件。","固定性变数":"判断法：为了公平实验而保持相同的条件。","观察":"不要混淆：观察写实际看到、量到或读到的事实；推断写科学解释。","推断":"不要混淆：推断解释观察事实，不把观察重新抄一次。","预测":"不要混淆：预测根据已有模式推测接下来可能出现的结果。","自转":"不要混淆：自转是地球绕地轴转动；公转是地球沿轨道绕太阳运行。","公转":"不要混淆：公转是地球沿轨道绕太阳运行；自转是地球绕地轴转动。"};
const modal=d.getElementById('modal');if(modal)new MutationObserver(()=>{if(!modal.classList.contains('open'))return;const title=d.getElementById('mt');if(!title)return;modal.querySelectorAll('.mixHint').forEach(x=>x.remove());const txt=conf[title.textContent.trim()];if(txt){const box=d.createElement('div');box.className='mixHint';box.innerHTML='<b>易错提醒：</b>'+txt;(d.getElementById('ma')||title).insertAdjacentElement('afterend',box)}}).observe(modal,{attributes:true,attributeFilter:['class']});
apply();}catch(e){console.warn(e)}});
</script></body></html>
